<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>A Little Adventure for You ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bf:'Press Start 2P','Courier New',monospace;--u:2px;--pink:#ff5c9d;--pink2:#ffb7e1;--ink:#2b1a5e;--ink2:#1a0d3e;--gold:#ffd27a;--cream:#fff4fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150d2e;overscroll-behavior:none;touch-action:none}
body{font-family:'Press Start 2P','Courier New',monospace;color:var(--cream)}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3a2680 0%,#150d2e 70%)}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 0 0 3px #3a2680,0 0 40px rgba(255,120,200,.25)}
#game{width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
body.playing #hud{display:block}
.hbox{position:absolute;display:flex;align-items:center;gap:calc(var(--u)*2);background:rgba(32,16,72,.72);color:#fff;padding:calc(var(--u)*2) calc(var(--u)*3);font-size:max(9px,calc(var(--u)*5.2));box-shadow:0 -2px 0 var(--pink2),0 2px 0 var(--pink2),-2px 0 0 var(--pink2),2px 0 0 var(--pink2)}
#hudL{top:calc(var(--u)*4);left:calc(var(--u)*4)}
#hudLevel{top:calc(var(--u)*4);left:50%;transform:translateX(-50%);font-size:max(7px,calc(var(--u)*3.6));opacity:.9;white-space:nowrap}
#hudBtns{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2);pointer-events:auto}
.hbtn{width:max(34px,calc(var(--u)*13));height:max(34px,calc(var(--u)*13));font:inherit;font-size:max(12px,calc(var(--u)*5));color:#fff;background:rgba(32,16,72,.78);border:0;cursor:pointer;box-shadow:0 -2px 0 var(--pink2),0 2px 0 var(--pink2),-2px 0 0 var(--pink2),2px 0 0 var(--pink2);display:flex;align-items:center;justify-content:center;padding:0}
.hbtn:active{background:var(--pink)}
.hicon{width:calc(7px*1.6);height:calc(6px*1.6);image-rendering:pixelated;min-width:14px;min-height:12px}
#toast{position:absolute;left:50%;top:calc(var(--u)*22);transform:translate(-50%,-10px);max-width:92%;text-align:center;background:rgba(32,16,72,.88);color:#fff;font-size:max(8px,calc(var(--u)*4.2));line-height:1.6;padding:calc(var(--u)*3) calc(var(--u)*4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 -2px 0 var(--gold),0 2px 0 var(--gold),-2px 0 0 var(--gold),2px 0 0 var(--gold);z-index:3}
#toast.on{opacity:1;transform:translate(-50%,0)}
#prompt{position:absolute;left:50%;bottom:calc(var(--u)*8);transform:translateX(-50%);background:var(--pink);color:#fff;font-size:max(8px,calc(var(--u)*4.2));padding:calc(var(--u)*2.5) calc(var(--u)*4);box-shadow:0 calc(var(--u)*1.2) 0 #8b1e55;animation:bob .9s steps(2) infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
/* touch controls */
#controls{display:none}
body.touch.playing #controls{display:flex}
.cbtn{pointer-events:auto;touch-action:none;font-family:inherit;color:#fff;background:rgba(43,26,94,.72);border:0;width:min(19vw,96px);height:min(19vw,96px);font-size:min(7vw,32px);box-shadow:0 -4px 0 var(--pink2),0 4px 0 var(--pink2),-4px 0 0 var(--pink2),4px 0 0 var(--pink2),inset 0 -8px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:0}
.cbtn.down{background:var(--pink);transform:translateY(3px)}
.cbtn.act{background:rgba(120,40,110,.72)}
.pad,.acts{display:flex;gap:min(4vw,22px);align-items:flex-end}
@media (orientation:portrait){
  #app{justify-content:flex-start}
  #stage{width:100vw;box-shadow:0 4px 0 #3a2680}
  #controls{position:relative;flex:1;width:100%;align-items:center;justify-content:space-between;padding:0 4vw calc(env(safe-area-inset-bottom) + 10px)}
  .acts{flex-direction:row-reverse}
}
@media (orientation:landscape){
  #controls{position:absolute;inset:0;pointer-events:none;align-items:flex-end;justify-content:space-between;padding:0 calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
  .cbtn{width:min(20vh,88px);height:min(20vh,88px);font-size:min(8vh,30px)}
  .pad,.acts{gap:min(4vh,22px)}
  .acts{flex-direction:row-reverse}
}
/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;background:rgba(18,8,46,.78);overflow:hidden}
.panel{position:relative;max-width:min(94vw,680px);max-height:94vh;max-height:94dvh;overflow:auto;background:var(--ink);padding:clamp(14px,3.2vmin,26px) clamp(14px,3.6vmin,30px);text-align:center;box-shadow:0 -4px 0 var(--pink2),0 4px 0 var(--pink2),-4px 0 0 var(--pink2),4px 0 0 var(--pink2),0 0 0 8px var(--ink2),0 0 60px rgba(255,100,190,.35);outline:3px solid #5a3cb0;outline-offset:-10px;touch-action:pan-y}
.gtitle{font-size:clamp(14px,3.6vmin,28px);line-height:1.5;color:#ffd1e8;text-shadow:3px 3px 0 #6a1b5e;margin-bottom:clamp(10px,2.4vmin,20px)}
.gtitle span{display:inline-block;animation:wave 1.8s steps(4) infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.body{font-family:var(--bf);font-size:clamp(10px,2.1vmin,16px);line-height:1.75;color:#fff4fa;white-space:pre-line;-webkit-user-select:text;user-select:text}
.tag{font-size:clamp(9px,1.9vmin,13px);color:var(--gold);margin-bottom:12px;line-height:1.6}
.hint{font-family:var(--bf);font-size:clamp(9px,1.7vmin,12px);line-height:1.7;color:#b9a6e8;margin-top:10px}
.pbtn{font-family:inherit;font-size:clamp(10px,2.2vmin,15px);line-height:1.5;color:#fff;background:var(--pink);border:0;padding:clamp(12px,2.4vmin,18px) clamp(14px,3vmin,24px);margin:8px 4px 0;cursor:pointer;box-shadow:inset 0 -6px 0 #c42e78,inset 0 4px 0 #ff9cc8,0 5px 0 var(--ink2);touch-action:manipulation}
.pbtn:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 #c42e78,inset 0 3px 0 #ff9cc8,0 1px 0 var(--ink2)}
.pbtn.alt{background:#7a55e0;box-shadow:inset 0 -6px 0 #4a30a8,inset 0 4px 0 #a68aff,0 5px 0 var(--ink2)}
.pbtn.dim{background:#4a3a7a;box-shadow:inset 0 -6px 0 #2e2255,0 5px 0 var(--ink2);color:#a999d0}
.pbtn.big{font-size:clamp(12px,2.8vmin,20px);padding:clamp(16px,3.2vmin,24px) clamp(18px,4vmin,34px)}
.pulse{animation:pulse 1.1s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.fadein{animation:fadeUp .6s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#lvlSel{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.chip{font-family:inherit;font-size:clamp(10px,2.2vmin,15px);width:clamp(46px,9vmin,64px);height:clamp(46px,9vmin,64px);border:0;color:#fff;background:#4a3a9a;cursor:pointer;box-shadow:0 -3px 0 var(--pink2),0 3px 0 var(--pink2),-3px 0 0 var(--pink2),3px 0 0 var(--pink2);padding:0;touch-action:manipulation}
.chip.lock{opacity:.45;box-shadow:0 -3px 0 #6a5aa8,0 3px 0 #6a5aa8,-3px 0 0 #6a5aa8,3px 0 0 #6a5aa8;cursor:default}
.xbtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;background:#4a3a9a;color:#fff;font-family:inherit;font-size:13px;cursor:pointer;z-index:2;padding:0}
/* puzzle */
.q{font-size:clamp(12px,2.5vmin,19px);line-height:1.6;margin-bottom:12px}
#pzChoices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{font-family:var(--bf);font-size:clamp(10px,2vmin,15px);line-height:1.6;color:#fff;background:#4a3a9a;border:0;padding:10px 14px;cursor:pointer;box-shadow:0 -3px 0 #8a6ae0,0 3px 0 #8a6ae0,-3px 0 0 #8a6ae0,3px 0 0 #8a6ae0;touch-action:manipulation}
.choice:active{background:var(--pink)}
.choice.bad{animation:shake .4s;background:#7a2a60}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#pzInput{width:100%;font-family:var(--bf);font-size:clamp(11px,2.2vmin,16px);padding:12px 12px;border:0;background:#fff4fa;color:#2b1a5e;-webkit-user-select:text;user-select:text;box-shadow:0 0 0 4px #8a6ae0;outline:none}
.fb{min-height:1.4em;margin-top:12px;color:#ffd1e8}
.fb.ok{color:#b8ffcf}
/* letter */
#letter .panel{max-width:min(94vw,640px);background:#fff4ea;color:#4a2a5e;outline-color:#e8b7cf;box-shadow:0 -4px 0 var(--gold),0 4px 0 var(--gold),-4px 0 0 var(--gold),4px 0 0 var(--gold),0 0 0 8px var(--ink2),0 0 70px rgba(255,200,120,.45);text-align:left}
#letterText p{margin:0 0 .75em;opacity:0;font-family:var(--bf);font-size:clamp(10px,2vmin,15px);line-height:1.8;color:#4a2a5e;white-space:pre-line;animation:fadeUp .8s both}
#letterText p.greet{font-family:'Press Start 2P',monospace;font-size:clamp(11px,2.4vmin,17px);line-height:1.6;color:#c42e78}
#letterText.skip p{animation-delay:0s!important;animation-duration:.01s!important}
.pframe{position:relative;width:min(70%,300px);margin:6px auto 18px;padding:10px;background:linear-gradient(135deg,#ffd27a,#ff9cc8);box-shadow:0 0 0 4px #4a2a5e,0 6px 0 4px #2b1a5e;transform:rotate(-1.5deg)}
.pframe img,.pframe canvas{display:block;width:100%;height:auto;border:4px solid #fff4ea;background:#2b1a5e}
.pframe canvas{image-rendering:pixelated}
.pframe:before,.pframe:after{content:'❤';position:absolute;font-size:18px;color:#fff;top:-12px}
.pframe:before{left:-10px}.pframe:after{right:-10px}
.pcap{font-family:var(--bf);text-align:center;font-size:10px;line-height:1.6;color:#8a4a7a;margin:-8px 0 14px}
#letterNext{display:block;margin:10px auto 0}
/* end */
#end{background:radial-gradient(ellipse at 50% 40%,rgba(120,40,140,.88),rgba(18,8,46,.95))}
#bigHeart{width:min(46vw,200px);height:auto;image-rendering:pixelated;animation:beat 1s steps(3) infinite;filter:drop-shadow(0 0 18px rgba(255,90,160,.8))}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(1.02)}60%{transform:scale(1.1)}}
.banner{font-size:clamp(12px,2.8vmin,20px);line-height:1.7;color:#ffd1e8;text-shadow:3px 3px 0 #6a1b5e;margin:14px 0 6px}
.floaty{position:fixed;bottom:-30px;font-size:22px;pointer-events:none;z-index:25;animation:rise 6s linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#fade{position:fixed;inset:0;background:#0d0620;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;text-align:center}
#fade.on{opacity:1;pointer-events:auto}
#fadeCard{font-size:clamp(11px,2.8vmin,20px);line-height:2;color:#ffd1e8;padding:20px}
#fadeCard b{display:block;font-size:clamp(16px,4.4vmin,34px);color:#fff;margin-top:6px;text-shadow:3px 3px 0 #6a1b5e;font-weight:normal}
#msgHeart{width:56px;height:48px;image-rendering:pixelated;animation:beat 1s steps(3) infinite;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.pulse,.gtitle span,#bigHeart{animation:none}}
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <div id="hud">
      <div class="hbox" id="hudL"><canvas class="hicon" width="7" height="6"></canvas><span id="hudHearts">0/0</span><span id="hudPz" class="hidden"></span></div>
      <div class="hbox" id="hudLevel"></div>
      <div id="hudBtns"><button class="hbtn" id="btnSound" aria-label="Sound">🔊</button><button class="hbtn" id="btnPause" aria-label="Pause">II</button></div>
    </div>
    <div id="toast"></div>
    <div id="prompt" class="hidden">PRESS E</div>
  </div>
  <div id="controls">
    <div class="pad"><button class="cbtn" id="bL" aria-label="Left">◀</button><button class="cbtn" id="bR" aria-label="Right">▶</button></div>
    <div class="acts"><button class="cbtn" id="bJump" aria-label="Jump">▲</button><button class="cbtn act" id="bAct" aria-label="Interact">♥</button></div>
  </div>
</div>

<!-- TITLE -->
<div id="title" class="overlay"><div class="panel">
  <div class="gtitle" id="gameTitle"></div>
  <div class="body" id="openMsg"></div>
  <div id="titleBtns" class="hidden">
    <button class="pbtn big pulse" id="btnStart">START OUR ADVENTURE</button><br>
    <button class="pbtn alt hidden" id="btnContinue">CONTINUE ❤️</button>
    <div id="lvlSel"></div>
  </div>
  <div class="hint" id="kbHint">WASD / ARROWS to move · SPACE to jump · E to interact · P to pause</div>
</div></div>

<!-- PAUSE -->
<div id="pause" class="overlay hidden"><div class="panel">
  <div class="gtitle" id="pauseTitle">PAUSED ❤️</div>
  <button class="pbtn big" id="btnResume">RESUME</button><br>
  <button class="pbtn alt" id="btnRestartLevel">RESTART LEVEL</button><br>
  <button class="pbtn alt" id="btnSound2">SOUND: ON</button><br>
  <button class="pbtn alt" id="btnSelect">LEVEL SELECT</button><br>
  <button class="pbtn dim" id="btnReset">START OVER</button>
</div></div>

<!-- LEVEL MESSAGE -->
<div id="msg" class="overlay hidden"><div class="panel">
  <canvas id="msgHeart" width="7" height="6"></canvas>
  <div class="tag" id="msgTag"></div>
  <div class="body" id="msgText"></div>
  <div class="hint" id="msgSub"></div>
  <button class="pbtn big pulse" id="msgBtn">CONTINUE ❤️</button>
</div></div>

<!-- PUZZLE -->
<div id="puzzle" class="overlay hidden"><div class="panel">
  <button class="xbtn" id="pzClose" aria-label="Close">✕</button>
  <div class="tag" id="pzTag"></div>
  <div class="body q" id="pzQ"></div>
  <div id="pzChoices"></div>
  <div id="pzTyped" class="hidden"><input id="pzInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer..."><button class="pbtn" id="pzGo">CHECK ❤️</button></div>
  <div class="body fb" id="pzFb"></div>
  <div class="hint" id="pzHint"></div>
</div></div>

<!-- LETTER -->
<div id="letter" class="overlay hidden"><div class="panel" id="letterPanel">
  <div class="pframe" id="photoBox"></div>
  <div class="pcap hidden" id="photoCap"></div>
  <div id="letterText"></div>
  <button class="pbtn big hidden" id="letterNext">❤ CONTINUE</button>
</div></div>

<!-- END -->
<div id="end" class="overlay hidden"><div class="panel" style="background:transparent;box-shadow:none;outline:none">
  <canvas id="bigHeart" width="13" height="11"></canvas>
  <div class="banner" id="endBanner"></div>
  <div class="hint" id="endHearts"></div>
  <button class="pbtn big" id="btnAgain">PLAY AGAIN</button>
  <button class="pbtn alt big" id="btnReread">READ MY LETTER AGAIN</button>
</div></div>

<div id="fade"><div id="fadeCard"></div></div>

<!-- ============================================================
     ✏️  CUSTOMIZE EVERYTHING HERE  ✏️
     Change the text between the quotes / backticks. Don't remove
     the commas or quotes. Save the file and refresh the page.
     ============================================================ -->
<script id="config">
const CONFIG = {

  /* ---------- NAMES ---------- */
  girlfriendName: "Nomka",          // use {name} anywhere in your text to insert this

  /* ---------- HEARTS NEEDED TO FINISH EACH LEVEL ----------

  /* ---------- LEVEL 3 PUZZLES ----------

      hint: "хорошо подумай бро, подсказку ты не должна видеть" },
    { question: "Лешка любит Номку?",
      answers: ["да"],
      choices: ["да", "нееет", "не знаюсьььь", "я жопка"],
      hint: "я жопка конечно хороший ответ, но выбирай другой" }
  ],
  wrongMessages: [
    "почти угадала",
    "чел давай еще раз",
    "броооооо ну лунка даже угадала бы",
    "жопикжопикжопик"
  ],
  rightMessage: "Ура ты гений бро все знаешь",

  /* ---------- THE FINAL LETTER ----------
     Leave an empty line between paragraphs. The first paragraph is shown as the title. */
  finalLetter: `любимке ❤️

если ты дошла до этого, то хочу сказать:

тебя очень любят и ценят!!! давай бро не сдавайся люто хардворк 

шучу, чуть-чуть ворк и вместе будем валяться кайфовать и суперпуперкруто любить друг-друга


люблю тебя!!! с днем рожденияяяяяя`,
  endBanner: "ХММММ, раз дошла до сюда то заслужила подсказку подарка: проверьте счет",

  /* ---------- PHOTO ----------
     Put a picture file (for example photo.jpg) in the SAME folder as index.html and
     write its name below. Leave "" to show a cute pixel drawing instead.              */
  photo: "",
  photoCaption: "",       // optional line under the photo

  /* ---------- MUSIC ----------
     Leave "" to use the built-in gentle music. Or put an mp3 next to index.html,
     e.g. "song.mp3", and it will loop through the whole game.                         */
  musicUrl: "",

  /* ==========================================================
     ВСЕ ОСТАЛЬНЫЕ НАДПИСИ ИГРЫ / ALL OTHER TEXTS IN THE GAME
     Меняйте только текст в кавычках. Куски вида {n} {x} {y} {s}
     {i} {name} заменяются игрой на числа/имя — оставьте их.
     ========================================================== */
  ui: {
    pageTitle: "НОМКЕ-ЖОПКЕ",   // название вкладки браузера
    titleHint: "WASD / ARROWS чтобы двигаться · SPACE прыгнуть · E to interact · P to pause",
    continueBtn: "CONTINUE ❤️",
    levelWord: "LEVEL",

    levelNames: ["The Flower Meadow", "The Starry Forest", "The Memory Garden", "Our Little Universe"],
    levelTips: [                                  // подсказка в начале каждого уровня
      "Collect {n} hearts to light up the way ❤️",
      "Find {n} hearts, then reach the moon gate 🌙",
      "Solve 3 puzzles and find {n} hearts ✨",

/* ---------------- game state ---------------- */

const kb = { left: 0, right: 0, jump: 0, act: 0 }, tc = { left: 0, right: 0, jump: 0, act: 0 }, edge = { jump: false, act: false };

function newPlayer(sp) { return { x: sp.x, y: sp.y - 16, w: 10, h: 16, vx: 0, vy: 0, dir: 1, onGround: false, coy: 0, buf: 0, standing: null, walk: false, wasGround: true, cele: false }; }
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function updateMovers() {
  for (const m of level.movers) { const nx = m.x0 + m.ax * Math.sin(tick * TAU / m.per + m.ph), ny = m.y0 + m.ay * Math.sin(tick * TAU / m.per + m.ph); m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny; }
}
function updatePlayer(c) {

  const ax = (c.right ? 1 : 0) - (c.left ? 1 : 0);
  if (ax) { p.vx += ax * (p.onGround ? .26 : .17); p.dir = ax; } else p.vx *= p.onGround ? .78 : .95;

    else { if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w; p.vx = 0; }

function respawn(msg) {

  const cpt = L.cp >= 0 ? L.cps[L.cp] : null, sx = cpt ? cpt.x - 5 : L.spawn.x, sy = cpt ? cpt.y - 16 : L.spawn.y - 16;
  p.x = sx; p.y = sy; p.vx = p.vy = 0; p.standing = null; Sound.sfx('bad'); toast(msg || U.oops, 1800); burst(p.x + 5, p.y + 8, 10, ['#ffd1e8', '#fff'], true); updateCam(true);

/* ---------------- interactions ---------------- */
function updateWorld(ctl) {
  const L = level, p = player, pc = p.x + 5, py = p.y + 8;
  // hearts
  for (const h of L.hearts) {
    if (h.got) continue;
    if (Math.abs(pc - h.x) < 10 && Math.abs(py - h.y) < 12) {
      h.got = true; hearts++; Sound.sfx('heart'); burst(h.x, h.y, 10, ['#ff6fa8', '#ffd1e8', '#fff', '#ffe27a'], true); updateHUD();
      if (hearts === need && L.n !== 4) toast(U.enoughHearts, 1500);
      if (L.n === 1 && hearts >= need && !L.done) { completeLevel(1); return; }
    }
  }
  // checkpoints
  L.cps.forEach((c, i) => { if (!c.on && Math.abs(pc - c.x) < 12 && Math.abs((p.y + 16) - c.y) < 22) { c.on = true; L.cp = i; Sound.sfx('cp'); burst(c.x, c.y - 16, 12, ['#ffe27a', '#fff', '#ffb7e1'], true); toast(U.checkpoint, 1400); } });
  // hazards & pits
  const body = { x: p.x + 1, y: p.y + 2, w: p.w - 2, h: p.h - 3 };
  for (const hz of L.haz) { if (hit(body, { x: hz.x + 1, y: hz.y + 3, w: hz.w - 2, h: hz.h - 3 })) { respawn(U.ouch); return; } }
  if (p.y > H + 24) { respawn(U.whoops); return; }
  // prompt + interaction
  let prompt = false;
  if (L.n === 3) {
    const st = L.stations.find(s => Math.abs(pc - s.x) < 30), ch = L.chest, nearChest = Math.abs(pc - ch.x) < 30 && !ch.opening;
    if (st && !st.solved) prompt = true; if (nearChest) prompt = true;
    if (ctl.actPressed) { if (st && !st.solved) { openPuzzle(st.id); return; } if (nearChest) tryOpenChest(); }
    if (ch.opening) { ch.opening++; ch.open = Math.min(1, ch.opening / 50); if (ch.opening % 3 === 0) burst(ch.x, ch.y - 14, 3, ['#ffe27a', '#fff', '#ffb7e1'], true); if (ch.opening === 90) completeLevel(3); }
  }
  if (L.n === 2 && L.gate && Math.abs(pc - L.gate.x) < 16 && !L.done) {
    if (hearts >= need) completeLevel(2);
    else if (tick - L.gate.near > 150) { L.gate.near = tick; toast(fm(U.gateNeeds, { n: need - hearts }), 2800); }
  }
  if (L.n === 4) {
    if (hearts >= need && pc > L.chest.x - 46 && state === 'play') { startFinale(); return; }
    if (hearts < need && p.x >= L.blockX - 1 && tick - (L.nag || -999) > 180) { L.nag = tick; toast(fm(U.wakeChest, { n: need - hearts }), 2800); }
  }
  setPrompt(prompt);
}
function tryOpenChest() {
  const L = level, ch = L.chest, solved = L.stations.filter(s => s.solved).length;
  if (solved < 3) { ch.wob = 30; Sound.sfx('bad'); toast(fm(U.chestSolveFirst, { s: solved }), 2600); }
  else if (hearts < need) { ch.wob = 30; Sound.sfx('bad'); toast(fm(U.needMoreHearts, { n: need - hearts }), 2600); }
  else { ch.opening = 1; Sound.sfx('chest'); }
}

/* ---------------- cutscene (finale) ---------------- */
function startFinale() {
  state = 'cutscene'; setPrompt(false); setBody(); cut = { t: 0, arr: null }; player.vx = 0; level.chest.open = 0;
}
function updateCutscene() {
  const L = level, p = player, c = cut; c.t++;
  const tx = L.chest.x - 26, dx = tx - (p.x + 5);
  const ctl = { left: false, right: false, jump: false, jumpPressed: false };
  if (c.arr == null) {
    if (Math.abs(dx) < 3 || c.t > 220) { c.arr = c.t; p.dir = 1; p.vx = 0; if (c.t > 220) p.x = tx - 5; }
    else { ctl.right = dx > 0; ctl.left = dx < 0; }
  }
  updatePlayer(ctl);
  if (c.arr != null) {
    const a = c.t - c.arr;
    if (a === 25) { Sound.sfx('chest'); Sound.play('finale'); }
    if (a >= 25 && a <= 75) L.chest.open = (a - 25) / 50; if (a > 75) L.chest.open = 1;
    if (a === 75) { flash = 1; burst(L.chest.x, L.chest.y - 12, 40, ['#ffe27a', '#fff', '#ffb7e1', '#ff6fa8'], true); }
    if (a > 75 && a < 200) { p.cele = true; if (a % 3 === 0) addP({ x: L.chest.x + rnd(-10, 10), y: L.chest.y - 16, vx: rnd(-.4, .4), vy: rnd(-1.4, -.6), life: 90, k: 'heart', c: ['#ff6fa8', '#ffb7e1', '#fff'][(Math.random() * 3) | 0] }); if (p.onGround && a % 38 === 0) p.vy = -3.2; }
    if (a === 190) { showLetter(); }
  }
}
function updateFinaleAmbient() { const L = level; if (tick % 6 === 0) addP({ x: L.chest.x + rnd(-40, 40), y: L.chest.y - 6, vx: rnd(-.2, .2), vy: rnd(-1, -.4), life: 100, k: 'heart', c: ['#ff6fa8', '#ffb7e1', '#fff', '#ffe27a'][(Math.random() * 4) | 0] }); if (L.chest.open < 1) L.chest.open = 1; }

/* ---------------- camera ---------------- */
function updateCam(snap) { const tx = clamp(player.x + 5 - W / 2 + player.dir * 18, 0, level.width - W); camX = snap ? tx : camX + (tx - camX) * .12; }

/* ---------------- main step ---------------- */
function step() {
  if (state === 'play') {
    tick++; lvlTime++;
    const ctl = { left: kb.left || tc.left, right: kb.right || tc.right, jump: kb.jump || tc.jump, jumpPressed: edge.jump, actPressed: edge.act };
    edge.jump = edge.act = false;
    updateMovers(); updatePlayer(ctl); updateWorld(ctl); updateCam();
    if (level.n === 1 && tick % 40 === 0 && Math.random() < .6) addP({ x: camX + rnd(0, W), y: H + 4, vy: -.3, vx: rnd(-.1, .1), life: 340, k: 'heart', c: '#ffc2e0' });
    if (level.n === 3 && tick % 7 === 0) addP({ x: camX + rnd(0, W + 60), y: -4, vx: rnd(-.6, -.2), vy: rnd(.25, .5), life: 400, c: '#ffc2dc', s: 2 });
    if (level.n === 3) { const f = level.stations[0]; if (Math.abs(camX + W / 2 - f.x) < 260 && tick % 2 === 0) addP({ x: f.x + rnd(-1, 1), y: 146 - 42, vx: rnd(-.7, .7), vy: -1.7, g: .1, life: 46, c: '#bfeaff', s: 1 }); }
  } else if (state === 'cutscene') {
    tick++; updateMovers(); updateCutscene(); updateCam(); flash = Math.max(0, flash - .03);
    if (level.chest.open > 0 && tick % 2 === 0) addP({ x: level.chest.x + rnd(-8, 8), y: level.chest.y - 10, vx: rnd(-.3, .3), vy: rnd(-1.2, -.5), life: 40, c: '#ffe27a', k: 'spark' });
  } else if (state === 'title') {
    tick++; camX += .3; if (tick % 30 === 0) addP({ x: camX + rnd(0, W), y: H + 4, vy: -.35, vx: rnd(-.1, .1), life: 420, k: 'heart', c: '#ffc2e0' });
  } else if (state === 'letter' || state === 'end') {
    tick++; updateFinaleAmbient(); flash = Math.max(0, flash - .03);
  } else if (state === 'dialog') { tick++; }
  updateParts();
}

  ctx.globalAlpha = .75 + .25 * Math.sin(tick * .1 + i); ctx.drawImage(g, Math.round(h.x - 11), Math.round(h.y + by - 11)); ctx.globalAlpha = 1;

function drawChest(ch, locked, ready) {

  ctx.drawImage(decoSpr('chest'), Math.round(x + wob), y);

  else { ctx.fillStyle = '#fff3b0'; ctx.fillRect(x + 2, y + 8, 20, 2); ctx.drawImage(decoSpr('chestLid'), 0, 0, 24, 10, x, Math.round(y + 2 - 12 * o), 24, Math.max(2, Math.round(10 * (1 - o * .75)))); }

  if (isTouch) document.body.classList.add('touch'); else $('#kbHint').classList.remove('hidden'); if (isTouch) $('#kbHint').classList.add('hidden');
  bindBtn('#bL', 'left'); bindBtn('#bR', 'right'); bindBtn('#bJump', 'jump'); bindBtn('#bAct', 'act');
  $('#btnStart').onclick = () => { Sound.init(); Sound.sfx('click'); typeSkip && typeSkip(); goLevel(1); };
  $('#btnContinue').onclick = () => { Sound.init(); Sound.sfx('click'); goLevel(clamp(save.finished ? 4 : save.unlocked, 1, 4)); };
  $('#title .panel').addEventListener('click', () => { if (typeSkip) typeSkip(); });
  $('#btnPause').onclick = () => { Sound.sfx('click'); pauseGame(); };
  $('#btnSound').onclick = () => { Sound.init(); Sound.toggle(); };
  $('#btnSound2').onclick = () => { Sound.init(); Sound.toggle(); };
  $('#btnResume').onclick = () => { Sound.sfx('click'); resumeGame(); };
  $('#btnRestartLevel').onclick = () => { Sound.sfx('click'); const n = curLevelNo; trans = false; state = 'play'; goLevel(n); };
  $('#btnSelect').onclick = () => { Sound.sfx('click'); showTitle(); };
  let rst = 0; $('#btnReset').onclick = () => { const b = $('#btnReset'); if (!rst) { rst = 1; b.textContent = U.sureTap; setTimeout(() => { rst = 0; b.textContent = U.startOver; }, 3000); return; } rst = 0; b.textContent = U.startOver; save = { unlocked: 1, hearts: [0, 0, 0, 0], finished: false }; writeSave(); titleSeen = false; showTitle(); };
  $('#pzClose').onclick = () => { if (pz && !pz.done) { Sound.sfx('click'); closePuzzle(false); } };
  $('#pzGo').onclick = () => answer($('#pzInput').value);
  window.addEventListener('resize', resizeUI); window.addEventListener('orientationchange', () => setTimeout(resizeUI, 200));
  refreshSoundBtns(); resizeUI(); showTitle();
  if (params.get('level')) { save.unlocked = 4; const n = clamp(parseInt(params.get('level'), 10) || 1, 1, 4); titleSeen = true; hide('#title'); goLevel(n); }
  let last = performance.now(), acc = 0;
  function frame(now) { acc += Math.min(100, now - last); last = now; let n = 0; while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; } render(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
boot();
</script>
